parameters:
  - name: deployment_name
    type: string
  - name: sample_request
    type: string
  - name: request_type
    type: string

steps:
  - task: AzureCLI@2
    displayName: Test batch deployment
    inputs:
      azureSubscription: $(ado_service_connection_rg)
      scriptType: bash
      workingDirectory: $(System.DefaultWorkingDirectory)
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        JOB_NAME=$(az ml batch-endpoint invoke --name $(endpoint_name) --deployment-name ${{ parameters.deployment_name }} --input ${{ parameters.sample_request }} --input-type ${{ parameters.request_type }} --query name -o tsv)
        az ml job show -n $JOB_NAME --web
        az ml job stream -n $JOB_NAME

        STATUS=$(az ml job show -n $JOB_NAME --query status -o tsv)
        echo $STATUS
        if [[ $STATUS == "Completed" ]]
        then
          echo "Job completed"
        elif [[ $STATUS ==  "Failed" ]]
        then
          echo "Job failed"
          exit 1
        else
          echo "Job status not failed or completed"
          exit 2
        fi

$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: open_science_sensor_health
description: Sensor-health clustering (open-science reference).

inputs:
  kpi_data:
    type: uri_folder
    path: azureml://datastores/kpi_datastore/paths/

outputs:
  output:
    type: uri_folder

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:cpu-cluster
  continue_on_step_failure: false

jobs:
  train_sensor_health:
    type: command
    display_name: sensor-health clustering
    code: ../src
    command: >-
      python train_sensor_health.py
      --kpi-data ${{inputs.kpi_data}}
      --output ${{outputs.output}}
      --threshold 0.6
    environment: azureml:metro-maintenance-env:1
    inputs:
      kpi_data: ${{parent.inputs.kpi_data}}
    outputs:
      output: ${{parent.outputs.output}}
